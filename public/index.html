<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زيادة مشاهدات إنستغرام مجاناً</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen text-white flex items-center justify-center p-4">

  <div class="bg-slate-800/80 backdrop-blur-md p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-lg w-full text-center">
    
    <div class="inline-flex p-3 bg-pink-500/20 text-pink-400 rounded-full mb-4">
      <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
    </div>

    <h1 class="text-2xl font-bold mb-2">مشاهدات إنستغرام مجانية</h1>
    <p class="text-slate-400 text-sm mb-6">احصل على 100 مشاهدة فورية لمنشورك أو مقطع الريلز مجاناً كل 24 ساعة.</p>

    <div class="space-y-4 text-right">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">رابط الفيديو أو الريلز:</label>
        <input id="postLink" type="url" placeholder="https://www.instagram.com/reel/C..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 text-left dir-ltr">
      </div>

      <button id="submitBtn" onclick="processOrder()" 
              class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-pink-500/25">
        إرسال المشاهدات الآن
      </button>
    </div>

    <!-- شريط تقدم وعداد (يظهر بعد الضغط مثل المواقع الاحترافية) -->
    <div id="progressArea" class="hidden mt-6 text-center">
      <p id="timerText" class="text-xs text-slate-400 mb-2">جاري فحص الحساب والمنشور... يرجى الانتظار <span id="seconds">15</span> ثانية</p>
      <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-pink-500 h-2 w-0 transition-all duration-1000"></div>
      </div>
    </div>

    <div id="resultMsg" class="mt-4 text-sm font-medium hidden"></div>
  </div>

  <script>
    async function processOrder() {
      const link = document.getElementById('postLink').value.trim();
      const btn = document.getElementById('submitBtn');
      const progressArea = document.getElementById('progressArea');
      const progressBar = document.getElementById('progressBar');
      const secondsSpan = document.getElementById('seconds');
      const resultMsg = document.getElementById('resultMsg');

      if (!link) {
        alert('يرجى إدخال الرابط أولاً');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      resultMsg.classList.add('hidden');
      progressArea.classList.remove('hidden');

      let timeLeft = 15;
      const totalTime = 15;

      const countdown = setInterval(async () => {
        timeLeft--;
        secondsSpan.innerText = timeLeft;
        progressBar.style.width = ((totalTime - timeLeft) / totalTime) * 100 + '%';

        if (timeLeft <= 0) {
          clearInterval(countdown);
          
          // إرسال الطلب بعد انتهاء العداد التنازلي
          try {
            const res = await fetch('/api/views', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ link })
            });

            const data = await res.json();
            progressArea.classList.add('hidden');

            if (res.ok) {
              resultMsg.className = "mt-4 text-sm font-medium text-emerald-400 p-3 bg-emerald-500/10 rounded-lg border border-emerald-500/20";
              resultMsg.innerText = `✅ تم إرسال 100 مشاهدة بنجاح! رقم العملية: ${data.orderId}`;
            } else {
              resultMsg.className = "mt-4 text-sm font-medium text-rose-400 p-3 bg-rose-500/10 rounded-lg border border-rose-500/20";
              resultMsg.innerText = `❌ ${data.error}`;
            }
          } catch (err) {
            progressArea.classList.add('hidden');
            resultMsg.className = "mt-4 text-sm font-medium text-rose-400 p-3 bg-rose-500/10 rounded-lg border border-rose-500/20";
            resultMsg.innerText = "❌ حدث خطأ في الاتصال بالخادم.";
          }

          resultMsg.classList.remove('hidden');
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }, 1000);
    }
  </script>
</body>
</html>
