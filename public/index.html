<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة طلبات إنستقرام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">طلب خدمات إنستقرام (رابط في كل سطر)</h4>
                    </div>
                    <div class="card-body">
                        <form id="instagramOrderForm">
                            
                            <!-- مفتاح الـ API المعتمد -->
                            <input type="hidden" id="api_key" value="C785a6cac437706b3babdd83b5b67c4c">
                            <!-- استبدل الرقم أدناه برقم خدمة إنستقرام المناسبة لديك في اللوحة -->
                            <input type="hidden" id="service_id" value="519"> 

                            <div class="mb-3">
                                <label for="instagram_links" class="form-label">روابط منشورات أو مقاطع إنستقرام</label>
                                <textarea class="form-control" id="instagram_links" rows="6" placeholder="https://www.instagram.com/p/...&#10;https://www.instagram.com/reel/..." required></textarea>
                                <div class="form-text">ضع كل رابط إنستقرام في سطر منفصل.</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">إرسال الطلبات الآن</button>
                        </form>

                        <div id="resultBox" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('instagramOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            
            const links = document.getElementById('instagram_links').value;
            const api_key = document.getElementById('api_key').value;
            const service_id = document.getElementById('service_id').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري إرسال الطلبات...';
            resultBox.innerHTML = '';

            try {
                const response = await fetch('/api/view', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links, api_key, service_id })
                });

                const data = await response.json();
                
                if (data.success) {
                    let htmlOutput = '<div class="alert alert-success"><h5>تمت المعالجة:</h5><ul>';
                    data.results.forEach(res => {
                        let statusText = res.response && res.response.order ? `تم بنجاح (رقم الطلب: ${res.response.order})` : `خطأ: ${JSON.stringify(res.response || res.error)}`;
                        htmlOutput += `<li><small class="text-muted">${res.link}</small><br><strong>${statusText}</strong></li>`;
                    });
                    htmlOutput += '</ul></div>';
                    resultBox.innerHTML = htmlOutput;
                } else {
                    resultBox.innerHTML = `<div class="alert alert-danger">حدث خطأ: ${data.message}</div>`;
                }
            } catch (error) {
                resultBox.innerHTML = `<div class="alert alert-danger">خطأ في الاتصال بالخادم: ${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال الطلبات الآن';
            }
        });
    </script>
</body>
</html>

    <div id="resultMsg" class="mt-4 text-sm font-medium hidden"></div>

  <script>
    async function processOrder() {
      const link = document.getElementById('postLink').value.trim();
      const btn = document.getElementById('submitBtn');
      const progressArea = document.getElementById('progressArea');
      const progressBar = document.getElementById('progressBar');
      const secondsSpan = document.getElementById('seconds');
      const resultMsg = document.getElementById('resultMsg');

      if (!link) {
        alert('يرجى إدخال رابط المنشور أو الريلز أولاً.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      resultMsg.classList.add('hidden');
      progressArea.classList.remove('hidden');

      let timeLeft = 15;
      const totalTime = 15;

      const countdown = setInterval(async () => {
        timeLeft--;
        secondsSpan.innerText = timeLeft;
        progressBar.style.width = ((totalTime - timeLeft) / totalTime) * 100 + '%';

        if (timeLeft <= 0) {
          clearInterval(countdown);
          
          try {
            const res = await fetch('/api/views', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ link })
            });

            const text = await res.text();
            let data;

            try {
              data = JSON.parse(text);
            } catch (e) {
              data = { error: `خطأ من السيرفر (كود ${res.status}): ${text.substring(0, 150)}` };
            }

            progressArea.classList.add('hidden');

            if (res.ok && data.success) {
              resultMsg.className = "mt-4 text-sm font-medium text-emerald-400 p-3 bg-emerald-500/10 rounded-lg border border-emerald-500/20";
              resultMsg.innerText = `✅ تم إرسال 100 مشاهدة بنجاح! رقم العملية: ${data.orderId}`;
            } else {
              resultMsg.className = "mt-4 text-sm font-medium text-rose-400 p-3 bg-rose-500/10 rounded-lg border border-rose-500/20";
              resultMsg.innerText = `❌ ${data.error || 'حدث خطأ أثناء معالجة الطلب.'}`;
            }
          } catch (err) {
            progressArea.classList.add('hidden');
            resultMsg.className = "mt-4 text-sm font-medium text-rose-400 p-3 bg-rose-500/10 rounded-lg border border-rose-500/20";
            resultMsg.innerText = `❌ تعذر الوصول للخادم: ${err.message}`;
          }

          resultMsg.classList.remove('hidden');
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }, 1000);
    }
  </script>
</body>
